# XcodeGen spec. CI: brew install xcodegen && xcodegen generate
name: EasyTuner
options:
  bundleIdPrefix: au.com.strapify
  deploymentTarget:
    iOS: "17.0"
settingGroups:
  common:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EasyTuner:
    type: application
    platform: iOS
    sources: [Tuner]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Easy Tuner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Easy Tuner listens to your guitar through the microphone to tell you if each string is in tune. Nothing is recorded or sent anywhere.
        UILaunchScreen: {}
        # Every orientation and multitasking size, so the iPhone Duo (folded and open) and iPad
        # get a native layout instead of a letterboxed compatibility window.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      groups: [common]
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: au.com.strapify.easytuner
        PRODUCT_NAME: EasyTuner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(ET_PROFILE_APP)

  EasyTunerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: EasyTuner
    settings:
      groups: [common]
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EasyTuner:
    build:
      targets:
        EasyTuner: all
    test:
      targets: [EasyTunerTests]
    archive:
      config: Release
